version: 2
updates:
  # Versão nova só depois de 7 dias publicada, salvo correção de segurança.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # Menor e correção vão num PR só por ecossistema. Um PR por pacote estourou
    # o limite diário de deploys da Vercel em 05/11/2026.
    groups:
      menores-e-correcoes:
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Menor e correção vão num PR só por ecossistema. Um PR por pacote estourou
    # o limite diário de deploys da Vercel em 05/11/2026.
    groups:
      menores-e-correcoes:
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
