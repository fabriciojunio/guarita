[project]
name = "guarita"
version = "0.1.0"
description = "Assistente de suporte com RAG e ferramentas MCP, atacado e defendido"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
mypy_path = "src"
